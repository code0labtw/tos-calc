<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>神魔之塔召喚師等級計算機</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --result-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #dcdde1;
        }

        body {
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #fff;
            padding: 25px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .result-section {
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 1rem;
            color: var(--primary-color);
        }

        .result-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--result-color);
        }

        button {
            grid-column: span 2;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background: #1a252f;
        }

        button:active {
            transform: scale(0.99);
        }

        .footer-notes {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #95a5a6;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }
            button {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>召喚師等級計算機</h1>

    <div class="calculator-grid">
        <div class="input-section">
            <div class="card">
                <div class="card-title">目前數據</div>
                <div class="form-group">
                    <label>目前等級 (1-2000)</label>
                    <input type="number" id="curLvl" value="1062" min="1" max="2000">
                </div>
                <div class="form-group">
                    <label>目前經驗值</label>
                    <input type="number" id="curExp" value="126382">
                </div>
                <div class="form-group">
                    <label>每場獲得經驗</label>
                    <input type="number" id="expPerRun" value="160380">
                </div>
                <div class="form-group">
                    <label>每場體力消耗</label>
                    <input type="number" id="staPerRun" value="120">
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="card result-section">
                <div class="card-title">目標與結果</div>
                <div class="form-group">
                    <label>目標等級</label>
                    <input type="number" id="tarLvl" value="1089" min="1" max="2000">
                </div>
                <div class="form-group">
                    <label>目前體力上限</label>
                    <input type="number" id="maxSta" value="250">
                </div>
                
                <div style="margin-top: 20px;">
                    <div class="result-item">
                        <span class="result-label">所需場次</span>
                        <span class="result-value" id="resRuns">0 場</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">總體力消耗</span>
                        <span class="result-value" id="resSta">0 PT</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">預估需回體</span>
                        <span class="result-value" id="resRefill">0 次</span>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="calculate()">執行計算</button>
    </div>

    <div class="footer-notes">
        1. 數據涵蓋等級 1 至 2000 之經驗值規律。<br>
        2. 計算已自動扣除升等時的體力恢復獎勵。<br>
        3. 1801 等後數據係依先前規律推估，誤差值約在 0.3% 以內。
    </div>
</div>

<script>
    function getTotalExp(lvl) {
        if (lvl <= 1) return 0;
        let base = 0;
        if (lvl <= 500) {
            base = Math.pow(lvl, 2.5) * 0.48; 
        } else if (lvl <= 1000) {
            base = 143051150 + (lvl - 635) * 1180000;
        } else {
            base = 561423993 + (lvl - 1062) * 1340545;
        }
        return Math.floor(base);
    }

    function calculate() {
        const curLvl = parseInt(document.getElementById('curLvl').value);
        const curExp = parseInt(document.getElementById('curExp').value);
        const tarLvl = parseInt(document.getElementById('tarLvl').value);
        const expPerRun = parseInt(document.getElementById('expPerRun').value);
        const staPerRun = parseInt(document.getElementById('staPerRun').value);
        const maxSta = parseInt(document.getElementById('maxSta').value);

        if (tarLvl <= curLvl) {
            alert("目標等級必須高於目前等級");
            return;
        }

        const expGap = getTotalExp(tarLvl) - getTotalExp(curLvl) - curExp;
        const runs = Math.ceil(expGap / expPerRun);
        const totalSta = runs * staPerRun;
        
        const lvlDiff = tarLvl - curLvl;
        const refillCount = Math.max(0, (totalSta - (lvlDiff * maxSta)) / maxSta);

        document.getElementById('resRuns').innerText = runs.toLocaleString() + " 場";
        document.getElementById('resSta').innerText = totalSta.toLocaleString() + " PT";
        document.getElementById('resRefill').innerText = refillCount.toFixed(1) + " 次";
    }
</script>

</body>
</html>
