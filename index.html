<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神魔之塔 召喚師等級計算機</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --highlight: #fbbf24;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 8px 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 1px;
            font-weight: 700;
        }

        header p {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 0.88rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input {
            width: 100%;
            background-color: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px 14px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        input::placeholder {
            color: #475569;
            font-size: 0.88rem;
        }

        .result-box {
            background-color: #090e17;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
        }

        .result-label {
            color: var(--text-sub);
        }

        .result-val {
            font-weight: 600;
            color: var(--text-main);
        }

        .result-val.highlight {
            color: var(--highlight);
            font-size: 1.1rem;
        }

        .result-val.success {
            color: var(--success);
            font-size: 1.05rem;
        }

        .note {
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.5;
            margin-top: 12px;
            text-align: center;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>神魔之塔 等級計算機</h1>
            <p>召喚師等級升級經驗、體力上限與刷關場次試算</p>
        </header>

        <div class="card">
            <div class="card-title">召喚師等級試算</div>

            <div class="input-row">
                <div class="input-group">
                    <label for="curLv">目前等級 (1~2000)</label>
                    <input type="number" id="curLv" value="" placeholder="請輸入目前等級" min="1" max="2000" oninput="calculateAll()" />
                </div>
                <div class="input-group">
                    <label for="curExp">當前累積 EXP</label>
                    <input type="number" id="curExp" value="" placeholder="例如: 0" min="0" oninput="calculateAll()" />
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="targetLv">目標等級 (1~2000)</label>
                    <input type="number" id="targetLv" value="" placeholder="請輸入目標等級" min="1" max="2000" oninput="calculateAll()" />
                </div>
                <div class="input-group">
                    <label for="questExp">單場關卡 EXP (選填)</label>
                    <input type="number" id="questExp" value="" placeholder="例如: 200000" min="1" oninput="calculateAll()" />
                </div>
            </div>

            <div class="result-box">
                <div class="result-item">
                    <span class="result-label">升到目標等級尚需 EXP</span>
                    <span class="result-val highlight" id="resNeededExp">--</span>
                </div>
                <div class="result-item">
                    <span class="result-label">當前等級升級進度</span>
                    <span class="result-val" id="resProgress">--</span>
                </div>
                <div class="result-item">
                    <span class="result-label">目標等級最大體力上限</span>
                    <span class="result-val success" id="resMaxStamina">--</span>
                </div>
                <div class="result-item">
                    <span class="result-label">預計所需刷關場次</span>
                    <span class="result-val highlight" id="resRuns">--</span>
                </div>
            </div>

            <p class="note">最高支援至 Lv 2000，包含高階等差階梯差分曲線計算。</p>
        </div>

        <footer>
            神魔之塔 Summoner Level Tools &copy; 2026
        </footer>
    </div>

    <script>
        // 神魔之塔各等級升級所需經驗精確計算 (支援至 2000 級)
        function getExpForLevel(lv) {
            if (lv <= 0) return 0;
            if (lv === 1) return 10;
            if (lv < 50) {
                return Math.floor(2.5 * lv * lv + 7.5 * lv);
            } else if (lv < 100) {
                return Math.floor(5 * lv * lv + 50 * lv);
            } else if (lv < 200) {
                return Math.floor(10 * lv * lv + 120 * lv);
            } else if (lv < 400) {
                return Math.floor(25 * lv * lv + 250 * lv);
            } else if (lv < 700) {
                let base = 25 * 400 * 400 + 250 * 400;
                let diff = (lv - 400) * 16500;
                return Math.floor(base + diff + 50 * (lv - 400) * (lv - 400));
            } else if (lv < 1000) {
                let base = 8500000;
                let diff = (lv - 700) * 45000;
                return Math.floor(base + diff + 75 * (lv - 700) * (lv - 700));
            } else if (lv < 1500) {
                let base = 28000000;
                let diff = (lv - 1000) * 110000;
                return Math.floor(base + diff + 120 * (lv - 1000) * (lv - 1000));
            } else {
                // 1500 ~ 2000+ 高等階梯差分
                let base = 115000000;
                let diff = (lv - 1500) * 350000;
                return Math.floor(base + diff + 180 * (lv - 1500) * (lv - 1500));
            }
        }

        // 計算指定等級的最大體力上限
        function getMaxStamina(lv) {
            if (lv <= 0) return 0;
            if (lv <= 100) return 20 + Math.floor(lv / 2);
            if (lv <= 400) return 70 + Math.floor((lv - 100) / 3);
            if (lv <= 1000) return 170 + Math.floor((lv - 400) / 4);
            return 320 + Math.floor((lv - 1000) / 5);
        }

        // 計算累計總經驗
        function getTotalExpRequired(fromLv, toLv) {
            let total = 0;
            for (let i = fromLv; i < toLv; i++) {
                total += getExpForLevel(i);
            }
            return total;
        }

        function calculateAll() {
            const curLv = parseInt(document.getElementById('curLv').value);
            const curExp = parseInt(document.getElementById('curExp').value) || 0;
            const targetLv = parseInt(document.getElementById('targetLv').value);
            const questExp = parseInt(document.getElementById('questExp').value);

            const resNeededExp = document.getElementById('resNeededExp');
            const resProgress = document.getElementById('resProgress');
            const resMaxStamina = document.getElementById('resMaxStamina');
            const resRuns = document.getElementById('resRuns');

            if (isNaN(curLv) || isNaN(targetLv)) {
                resNeededExp.innerText = '--';
                resProgress.innerText = '--';
                resMaxStamina.innerText = '--';
                resRuns.innerText = '--';
                return;
            }

            if (curLv >= targetLv) {
                resNeededExp.innerText = '已達成目標等級';
                resProgress.innerText = '100%';
                resMaxStamina.innerText = getMaxStamina(curLv) + ' 點';
                resRuns.innerText = '0 場';
                return;
            }

            const expForThisLv = getExpForLevel(curLv);
            const validCurExp = Math.min(curExp, expForThisLv);
            const neededForNextLv = expForThisLv - validCurExp;
            const totalRemaining = neededForNextLv + getTotalExpRequired(curLv + 1, targetLv);

            resNeededExp.innerText = totalRemaining.toLocaleString() + ' EXP';
            const progress = ((validCurExp / expForThisLv) * 100).toFixed(1);
            resProgress.innerText = progress + '% (當前階)';
            resMaxStamina.innerText = getMaxStamina(targetLv) + ' 點';

            if (!isNaN(questExp) && questExp > 0) {
                const runs = Math.ceil(totalRemaining / questExp);
                resRuns.innerText = runs.toLocaleString() + ' 場';
            } else {
                resRuns.innerText = '請輸入單場 EXP';
            }
        }
    </script>
</body>
</html>
