<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="神魔之塔召喚師等級與體力恢復計算工具。">
  <title>神魔之塔｜召喚師等級與體力計算</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-soft: #0d1a2d;
      --panel: rgba(15, 30, 50, 0.9);
      --panel-strong: #10223a;
      --line: rgba(148, 163, 184, 0.18);
      --line-strong: rgba(125, 211, 252, 0.38);
      --text: #e6f0fb;
      --muted: #93a7bc;
      --sky: #38bdf8;
      --sky-soft: #082f49;
      --cyan: #67e8f9;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #fb7185;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 8% 0%, rgba(14, 165, 233, 0.18), transparent 32rem),
        radial-gradient(circle at 100% 10%, rgba(59, 130, 246, 0.13), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.6;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      border-radius: 99px;
      background: var(--sky);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(1.9rem, 4vw, 3.2rem);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .verified-badge {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid rgba(52, 211, 153, 0.32);
      border-radius: 14px;
      background: rgba(6, 78, 59, 0.28);
      color: #a7f3d0;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.86fr) minmax(0, 1.45fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(17, 36, 60, 0.96), rgba(10, 25, 43, 0.94));
      box-shadow: var(--shadow);
    }

    .input-card {
      position: sticky;
      top: 18px;
      padding: 24px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .card-title {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .card-description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .section-label {
      margin: 20px 0 10px;
      color: #c7d9ec;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      color: #c7d9ec;
      font-size: 0.88rem;
      font-weight: 650;
    }

    .hint {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 400;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 12px;
      outline: none;
      padding: 12px 13px;
      background: rgba(3, 12, 24, 0.72);
      color: var(--text);
      font: inherit;
      font-variant-numeric: tabular-nums;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input:hover { border-color: rgba(125, 211, 252, 0.45); }
    input:focus {
      border-color: var(--sky);
      background: rgba(7, 24, 43, 0.92);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
    }

    input.invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.13);
    }

    .field-message {
      min-height: 18px;
      color: var(--red);
      font-size: 0.76rem;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 44px;
      margin-top: 18px;
      padding: 11px 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      background: rgba(8, 47, 73, 0.32);
      color: #bae6fd;
      font-size: 0.82rem;
    }

    .status.error {
      border-color: rgba(251, 113, 133, 0.34);
      background: rgba(127, 29, 29, 0.24);
      color: #fecdd3;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      margin-top: 7px;
      border-radius: 50%;
      background: var(--sky);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    .status.error .status-dot {
      background: var(--red);
      box-shadow: 0 0 12px rgba(251, 113, 133, 0.9);
    }

    .results {
      display: grid;
      gap: 20px;
    }

    .primary-result {
      position: relative;
      overflow: hidden;
      padding: 26px;
      border-color: var(--line-strong);
      background:
        radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.2), transparent 20rem),
        linear-gradient(145deg, rgba(15, 45, 72, 0.98), rgba(10, 29, 49, 0.96));
    }

    .primary-result::after {
      position: absolute;
      right: -36px;
      bottom: -68px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(103, 232, 249, 0.18);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 18px rgba(103, 232, 249, 0.035), 0 0 0 38px rgba(103, 232, 249, 0.025);
    }

    .result-label {
      color: #bae6fd;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .result-value {
      margin-top: 5px;
      color: #f0f9ff;
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 850;
      letter-spacing: -0.05em;
      line-height: 1.08;
      font-variant-numeric: tabular-nums;
    }

    .result-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .metric {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(10, 25, 43, 0.72);
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
    }

    .metric-value {
      margin-top: 7px;
      color: var(--text);
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 820;
      letter-spacing: -0.04em;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .metric-value .unit {
      margin-left: 4px;
      color: var(--sky);
      font-size: 0.72em;
      font-weight: 750;
      letter-spacing: 0;
    }

    .metric-note {
      min-height: 24px;
      margin-top: 9px;
      color: #8fa8bf;
      font-size: 0.76rem;
    }

    .progress-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(10, 25, 43, 0.72);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .progress-number {
      color: var(--cyan);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 12px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0ea5e9, #67e8f9);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.48);
      transition: width 180ms ease;
    }

    .source-card {
      padding: 20px 22px;
      border: 1px solid rgba(251, 191, 36, 0.22);
      border-radius: 18px;
      background: rgba(120, 53, 15, 0.16);
    }

    .source-card h2 {
      margin: 0 0 8px;
      color: #fde68a;
      font-size: 0.98rem;
    }

    .source-card p {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.82rem;
    }

    .footer {
      margin-top: 26px;
      color: #71869d;
      font-size: 0.76rem;
      text-align: center;
    }

    .hidden { display: none; }
    [hidden] { display: none !important; }

    .tool-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-width: 620px;
      margin: 0 auto 20px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(10, 25, 43, 0.8);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
    }

    .tool-tab {
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 12px 14px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 750;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .tool-tab:hover { color: var(--text); }

    .tool-tab.active {
      border-color: rgba(56, 189, 248, 0.42);
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.42), rgba(8, 47, 73, 0.72));
      color: #e0f2fe;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.12);
    }

    .result-actions {
      position: relative;
      z-index: 1;
      margin-top: 18px;
    }

    .secondary-button {
      border: 1px solid rgba(125, 211, 252, 0.36);
      border-radius: 10px;
      padding: 10px 13px;
      background: rgba(8, 47, 73, 0.52);
      color: #bae6fd;
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 750;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .secondary-button:hover {
      border-color: var(--sky);
      background: rgba(14, 116, 144, 0.48);
      transform: translateY(-1px);
    }

    .secondary-button:focus-visible, .tool-tab:focus-visible {
      outline: 3px solid rgba(103, 232, 249, 0.35);
      outline-offset: 2px;
    }

    @media (max-width: 840px) {
      .hero { align-items: flex-start; flex-direction: column; }
      .verified-badge { width: 100%; text-align: left; }
      .layout { grid-template-columns: 1fr; }
      .input-card { position: static; }
    }

    @media (max-width: 520px) {
      .shell { width: min(100% - 22px, 1120px); padding-top: 28px; }
      .input-card, .primary-result { padding: 20px; }
      .field-grid, .metric-grid, .tool-switch { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .card { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>神魔之塔計算工具</h1>
    </header>

    <div class="tool-switch" role="tablist" aria-label="選擇計算工具">
      <button class="tool-tab active" id="levelTab" type="button" role="tab" aria-selected="true" aria-controls="levelToolPanel">召喚師等級計算</button>
      <button class="tool-tab" id="staminaTab" type="button" role="tab" aria-selected="false" aria-controls="staminaToolPanel">體力恢復計算</button>
    </div>

    <section class="tool-panel" id="levelToolPanel" role="tabpanel" aria-labelledby="levelTab">
      <section class="layout" aria-label="召喚師等級計算">
        <section class="card input-card">
          <div class="card-header">
            <h2 class="card-title">召喚師等級計算</h2>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="currentLevel">目前等級 <span class="hint">1 至 2000</span></label>
              <input id="currentLevel" type="number" min="1" max="2000" step="1" inputmode="numeric">
              <div class="field-message" id="currentLevelMessage"></div>
            </div>
            <div class="field">
              <label for="targetLevel">目標等級 <span class="hint">1 至 2000</span></label>
              <input id="targetLevel" type="number" min="1" max="2000" step="1" inputmode="numeric">
              <div class="field-message" id="targetLevelMessage"></div>
            </div>
            <div class="field full">
              <label for="currentExp">目前等級已累積 EXP</label>
              <input id="currentExp" type="number" min="0" step="1" inputmode="numeric">
              <div class="field-message" id="currentExpMessage"></div>
            </div>
            <div class="field">
              <label for="stageExp">單場關卡獲得 EXP</label>
              <input id="stageExp" type="number" min="0" step="1" inputmode="numeric">
              <div class="field-message" id="stageExpMessage"></div>
            </div>
            <div class="field">
              <label for="stageStamina">單場關卡消耗體力</label>
              <input id="stageStamina" type="number" min="0" step="1" inputmode="numeric">
              <div class="field-message" id="stageStaminaMessage"></div>
            </div>
          </div>
        </section>

        <section class="results" aria-live="polite">
          <article class="card primary-result">
            <div class="result-label">升到目標等級尚需 EXP</div>
            <div class="result-value" id="requiredExp">—</div>
          </article>

          <div class="metric-grid">
            <article class="metric">
              <div class="metric-label">當前等級升級進度</div>
              <div class="metric-value" id="currentProgress">— <span class="unit">%</span></div>
            </article>
            <article class="metric">
              <div class="metric-label">預計所需刷關場次</div>
              <div class="metric-value" id="stageCount">— <span class="unit">場</span></div>
            </article>
            <article class="metric">
              <div class="metric-label">目標等級體力上限</div>
              <div class="metric-value" id="targetStaminaMax">— <span class="unit">體力</span></div>
            </article>
            <article class="metric">
              <div class="metric-label">目前等級體力上限</div>
              <div class="metric-value" id="levelCurrentStaminaMax">— <span class="unit">體力</span></div>
            </article>
            <article class="metric">
              <div class="metric-label">目標等級隊伍空間 Cost</div>
              <div class="metric-value" id="targetTeamCost">— <span class="unit">Cost</span></div>
            </article>
            <article class="metric">
              <div class="metric-label">目前等級隊伍空間 Cost</div>
              <div class="metric-value" id="levelCurrentTeamCost">— <span class="unit">Cost</span></div>
            </article>
          </div>

          <article class="card primary-result">
            <div class="result-label">總共消耗體力</div>
            <div class="result-value" id="totalStamina">—</div>
          </article>
        </section>
      </section>
    </section>

    <section class="tool-panel hidden" id="staminaToolPanel" role="tabpanel" aria-labelledby="staminaTab" hidden>
      <section class="layout" aria-label="體力恢復計算">
        <section class="card input-card">
          <div class="card-header">
            <h2 class="card-title">目前體力狀態</h2>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="currentStamina">目前剩餘體力</label>
              <input id="currentStamina" type="number" min="0" step="1" inputmode="numeric">
              <div class="field-message" id="currentStaminaMessage"></div>
            </div>
            <div class="field">
              <label for="currentStaminaMax">目前最大體力</label>
              <input id="currentStaminaMax" type="number" min="1" step="1" inputmode="numeric">
              <div class="field-message" id="currentStaminaMaxMessage"></div>
            </div>
          </div>
        </section>

        <section class="results" aria-live="polite">
          <article class="card primary-result">
            <div class="result-label">恢復時間</div>
            <div class="result-value" id="recoveryTime">—</div>
          </article>
        </section>
      </section>
    </section>

  </main>

  <script>

13316,"staminaMax":312,"teamCost":394,"expDifference":2049,"sourceLine":1995},{"level":1989,"toNextExp":3092152,"cumulativeExp":2592303419,"staminaMax":312,"teamCost":394,"expDifference":2049,"sourceLine":1996},{"level":1990,"toNextExp":3094201,"cumulativeExp":2595395571,"staminaMax":312,"teamCost":394,"expDifference":2049,"sourceLine":1997},{"level":1991,"toNextExp":3096250,"cumulativeExp":2598489772,"staminaMax":312,"teamCost":394,"expDifference":2049,"sourceLine":1998},{"level":1992,"toNextExp":3098302,"cumulativeExp":2601586022,"staminaMax":312,"teamCost":394,"expDifference":2052,"sourceLine":1999},{"level":1993,"toNextExp":3100354,"cumulativeExp":2604684324,"staminaMax":312,"teamCost":395,"expDifference":2052,"sourceLine":2000},{"level":1994,"toNextExp":3102406,"cumulativeExp":2607784678,"staminaMax":312,"teamCost":395,"expDifference":2052,"sourceLine":2001},{"level":1995,"toNextExp":3104458,"cumulativeExp":2610887084,"staminaMax":313,"teamCost":395,"expDifference":2052,"sourceLine":2002},{"level":1996,"toNextExp":3106510,"cumulativeExp":2613991542,"staminaMax":313,"teamCost":395,"expDifference":2052,"sourceLine":2003},{"level":1997,"toNextExp":3108562,"cumulativeExp":2617098052,"staminaMax":313,"teamCost":395,"expDifference":2052,"sourceLine":2004},{"level":1998,"toNextExp":3110614,"cumulativeExp":2620206614,"staminaMax":313,"teamCost":395,"expDifference":2052,"sourceLine":2005},{"level":1999,"toNextExp":3112666,"cumulativeExp":2623317228,"staminaMax":313,"teamCost":396,"expDifference":2052,"sourceLine":2006},{"level":2000,"toNextExp":3114718,"cumulativeExp":2626429894,"staminaMax":313,"teamCost":396,"expDifference":2052,"sourceLine":2007}];
    const levels = new Map(levelData.map(record => [record.level, record]));
    const numberFormat = new Intl.NumberFormat('zh-TW');
    const RECOVERY_MINUTES_PER_STAMINA = 8;
    const levelFields = ['currentLevel', 'currentExp', 'targetLevel', 'stageExp', 'stageStamina'];
    const staminaFields = ['currentStamina', 'currentStaminaMax'];

    const $ = id => document.getElementById(id);

    function readNumber(id) {
      const value = $(id).value.trim();
      return value === '' ? NaN : Number(value);
    }

    function formatInteger(value) {
      return Number.isFinite(value) ? numberFormat.format(Math.round(value)) : '—';
    }

    function formatRecoveryTime(stamina) {
      const totalMinutes = Math.max(0, Math.round(stamina * RECOVERY_MINUTES_PER_STAMINA));
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;
      const parts = [];
      if (days > 0) parts.push(days + '日');
      if (hours > 0) parts.push(hours + '小時');
      if (minutes > 0 || parts.length === 0) parts.push(minutes + '分鐘');
      return parts.join(' ');
    }

    function setMessage(id, message) {
      $(id + 'Message').textContent = message;
      $(id).classList.toggle('invalid', message !== '');
    }

    function setMetric(id, value, unit) {
      $(id).innerHTML = value + ' <span class="unit">' + unit + '</span>';
    }

    function clearMessages(fieldIds) {
      fieldIds.forEach(id => setMessage(id, ''));
    }

    function resetLevelResults() {
      $('requiredExp').textContent = '—';
      setMetric('currentProgress', '—', '%');
      setMetric('stageCount', '—', '場');
      setMetric('targetStaminaMax', '—', '體力');
      setMetric('levelCurrentStaminaMax', '—', '體力');
      setMetric('targetTeamCost', '—', 'Cost');
      setMetric('levelCurrentTeamCost', '—', 'Cost');
      $('totalStamina').textContent = '—';
    }

    function calculateLevel() {
      clearMessages(levelFields);
      const currentLevel = readNumber('currentLevel');
      const currentExp = readNumber('currentExp');
      const targetLevel = readNumber('targetLevel');
      const stageExp = readNumber('stageExp');
      const stageStamina = readNumber('stageStamina');
      if ([currentLevel, currentExp, targetLevel, stageExp, stageStamina].some(value => !Number.isFinite(value))) {
        resetLevelResults();
        return;
      }

      let hasError = false;
      if (!Number.isInteger(currentLevel) || currentLevel < 1 || currentLevel > 2000) {
        setMessage('currentLevel', '請輸入 1 至 2000 的整數。');
        hasError = true;
      }
      if (!Number.isInteger(targetLevel) || targetLevel < 1 || targetLevel > 2000) {
        setMessage('targetLevel', '請輸入 1 至 2000 的整數。');
        hasError = true;
      }
      if (currentExp < 0) {
        setMessage('currentExp', '目前等級已累積 EXP 不可小於 0。');
        hasError = true;
      }
      if (stageExp <= 0) {
        setMessage('stageExp', '單場關卡獲得 EXP 必須大於 0。');
        hasError = true;
      }
      if (stageStamina < 0) {
        setMessage('stageStamina', '單場關卡消耗體力不可小於 0。');
        hasError = true;
      }

      const current = levels.get(currentLevel);
      const target = levels.get(targetLevel);
      if (current && currentExp > current.toNextExp) {
        setMessage('currentExp', '不可高於目前等級升到下級所需 EXP。');
        hasError = true;
      }
      if (Number.isInteger(currentLevel) && Number.isInteger(targetLevel) && targetLevel < currentLevel) {
        setMessage('targetLevel', '目標等級不可低於目前等級。');
        hasError = true;
      }
      if (hasError || !current || !target) {
        resetLevelResults();
        return;
      }

      const progress = currentLevel === 2000 ? 100 : Math.min(100, Math.max(0, currentExp / current.toNextExp * 100));
      const remainingExp = Math.max(0, target.cumulativeExp - current.cumulativeExp - currentExp);
      const stageCount = remainingExp === 0 ? 0 : Math.ceil(remainingExp / stageExp);
      const totalStamina = stageCount * stageStamina;

      $('requiredExp').textContent = formatInteger(remainingExp);
      setMetric('currentProgress', progress.toFixed(2), '%');
      setMetric('stageCount', formatInteger(stageCount), '場');
      setMetric('targetStaminaMax', formatInteger(target.staminaMax), '體力');
      setMetric('levelCurrentStaminaMax', formatInteger(current.staminaMax), '體力');
      setMetric('targetTeamCost', formatInteger(target.teamCost), 'Cost');
      setMetric('levelCurrentTeamCost', formatInteger(current.teamCost), 'Cost');
      $('totalStamina').textContent = formatInteger(totalStamina) + ' 體力';
    }

    function resetStaminaResult() {
      $('recoveryTime').textContent = '—';
    }

    function calculateStamina() {
      clearMessages(staminaFields);
      const currentStamina = readNumber('currentStamina');
      const currentStaminaMax = readNumber('currentStaminaMax');
      if (!Number.isFinite(currentStamina) || !Number.isFinite(currentStaminaMax)) {
        resetStaminaResult();
        return;
      }

      let hasError = false;
      if (currentStamina < 0) {
        setMessage('currentStamina', '目前剩餘體力不可小於 0。');
        hasError = true;
      }
      if (currentStaminaMax <= 0) {
        setMessage('currentStaminaMax', '目前最大體力必須大於 0。');
        hasError = true;
      }
      if (currentStamina > currentStaminaMax) {
        setMessage('currentStamina', '目前剩餘體力不可高於目前最大體力。');
        hasError = true;
      }
      if (hasError) {
        resetStaminaResult();
        return;
      }

      const missingStamina = Math.max(0, currentStaminaMax - currentStamina);
      $('recoveryTime').textContent = formatRecoveryTime(missingStamina);
    }

    function switchTool(tool) {
      const isLevel = tool === 'level';
      $('levelToolPanel').hidden = !isLevel;
      $('levelToolPanel').classList.toggle('hidden', !isLevel);
      $('staminaToolPanel').hidden = isLevel;
      $('staminaToolPanel').classList.toggle('hidden', isLevel);
      $('levelTab').classList.toggle('active', isLevel);
      $('levelTab').setAttribute('aria-selected', String(isLevel));
      $('staminaTab').classList.toggle('active', !isLevel);
      $('staminaTab').setAttribute('aria-selected', String(!isLevel));
      if (isLevel) calculateLevel();
      else calculateStamina();
    }

    $('levelTab').addEventListener('click', () => switchTool('level'));
    $('staminaTab').addEventListener('click', () => switchTool('stamina'));
    levelFields.forEach(id => $(id).addEventListener('input', calculateLevel));
    staminaFields.forEach(id => $(id).addEventListener('input', calculateStamina));
    switchTool('level');
  </script>
